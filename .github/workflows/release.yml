name: LUM Release Build

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: '--target aarch64-apple-darwin --bundles dmg'
          - platform: macos-13
            args: '--target x86_64-apple-darwin --bundles dmg'
          - platform: ubuntu-22.04
            args: '--bundles deb,appimage'
          - platform: windows-latest
            args: '--bundles msi,nsis'

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin' || matrix.platform == 'macos-13' && 'x86_64-apple-darwin' || '' }}

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libasound2-dev \
            libxdo-dev libxtst-dev libx11-dev libxrandr-dev

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'LUM ${{ github.ref_name }}'
          releaseBody: |
            ## LUM ${{ github.ref_name }}

            실제 PTY 터미널 + 로컬 AI가 통합된 Warp 스타일 터미널 에뮬레이터.

            ### 설치
            - **macOS (Apple Silicon)**: `LUM_aarch64.dmg`
            - **macOS (Intel)**: `LUM_x64.dmg`
            - **Windows**: `LUM-Setup.exe` (NSIS) 또는 `LUM_x64_en-US.msi`
            - **Linux**: `lum_amd64.deb` 또는 `lum_amd64.AppImage`

            > 코드 서명이 없으므로 macOS는 `우클릭 → 열기`, Windows는 `추가 정보 → 실행`으로 설치하세요.

            ### 주요 변경사항
            이 릴리즈의 변경사항은 [CHANGELOG](https://github.com/Code2731/Lum/commits/main)를 참고하세요.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
