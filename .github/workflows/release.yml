name: LUM Release Build

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: "릴리스 태그 (예: v0.3.1)"
        required: true
        default: "v0.3.1"
  push:
    tags:
      - 'v*'

jobs:
  build:
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag_name || github.ref_name }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: '--target aarch64-apple-darwin --bundles dmg'
          - platform: macos-13
            args: '--target x86_64-apple-darwin --bundles dmg'
          - platform: windows-latest
            args: '--bundles msi,nsis'

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin' || matrix.platform == 'macos-13' && 'x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: 'LUM ${{ env.RELEASE_TAG }}'
          releaseBody: |
            ## LUM ${{ env.RELEASE_TAG }}

            실제 PTY 터미널 + 로컬 AI가 통합된 Warp 스타일 터미널 에뮬레이터.

            ### 설치
            파일명 규칙: `LUM.Terminal_{version}_{arch}.{ext}`

            - **macOS (Apple Silicon, M1/M2/M3/M4)**: `LUM.Terminal_*_aarch64.dmg`
            - **macOS (Intel)**: `LUM.Terminal_*_x64.dmg`
            - 현재 머신 아키텍처에 맞는 DMG를 바로 받으려면 아래 명령을 실행:

              ```bash
              bash scripts/download-latest-lum-macos.sh
              ```
            - macOS는 코드 서명/노타이즈가 미적용 상태입니다. 설치 시 `우클릭 → 열기`가 필요할 수 있습니다.
            - **Windows**: `LUM.Terminal_*_x64-setup.exe` (NSIS) 또는 `LUM.Terminal_*_x64_en-US.msi`
            > 코드 서명이 없으므로 macOS는 `우클릭 → 열기`, Windows는 `추가 정보 → 실행`으로 설치하세요.

            ### 주요 변경사항
            이 릴리즈의 변경사항은 [CHANGELOG](https://github.com/Code2731/Lum/commits/main)를 참고하세요.
          # 태그 푸시 또는 수동 실행 시 즉시 공개 릴리즈로 생성.
          # 수동 실행의 경우, 입력한 태그와 동일한 이름으로 배포 아티팩트가 생성됩니다.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
