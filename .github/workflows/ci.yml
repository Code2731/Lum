name: LUM CI (Continuous Integration)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 1. Setup Node.js & Test Frontend
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Frontend Dependencies
        run: npm install

      - name: Run Frontend Tests (Vitest)
        run: npm test

      - name: Build Frontend
        run: npm run build

      # 2. Setup Rust & Test Backend
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install System Dependencies (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf \
            libasound2-dev libxdo-dev libxtst-dev libx11-dev libxrandr-dev \
            libxcb1-dev libxcb-shm0-dev libxcb-randr0-dev

      - name: Rust Format Check
        run: cd src-tauri && cargo fmt -- --check

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Backend Check & Clippy
        # clippy 경고는 안내용으로만 실행. 에러만 CI 실패 유발.
        # 추후 품질 게이트 강화 시 -D warnings 복원 고려.
        run: cd src-tauri && cargo check --no-default-features && cargo clippy --no-default-features -- -A warnings

      - name: Run Backend Tests
        run: cd src-tauri && cargo test

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright Smoke Test (CI noserver)
        shell: bash
        run: |
          set -euo pipefail

          DEV_SERVER_LOG_FILE="/tmp/lum-e2e-dev-server.log"
          npm run dev -- --host 127.0.0.1 --port 1420 >"${DEV_SERVER_LOG_FILE}" 2>&1 &
          DEV_SERVER_PID=$!

          cleanup() {
            if kill -0 "${DEV_SERVER_PID}" >/dev/null 2>&1; then
              kill "${DEV_SERVER_PID}" || true
              wait "${DEV_SERVER_PID}" || true
            fi
          }
          trap cleanup EXIT

          echo "Starting Vite dev server for CI E2E..."
          for attempt in {1..60}; do
            if curl -fsS http://127.0.0.1:1420 >/dev/null; then
              echo "Vite server is ready."
              break
            fi
            if ! kill -0 "${DEV_SERVER_PID}" >/dev/null 2>&1; then
              echo "Vite server exited before readiness check."
              echo "---- Vite server log (last 200 lines) ----"
              tail -n 200 "${DEV_SERVER_LOG_FILE}" || true
              exit 1
            fi
            if [ "${attempt}" -eq 60 ]; then
              echo "Vite server failed to become ready within 60 seconds."
              echo "---- Vite server log (last 200 lines) ----"
              tail -n 200 "${DEV_SERVER_LOG_FILE}" || true
              exit 1
            fi
            sleep 1
          done

          set +e
          E2E_NO_WEB_SERVER=1 npm run test:e2e:noserver
          TEST_STATUS=$?
          set -e

          if [ "${TEST_STATUS}" -ne 0 ]; then
            echo "Playwright smoke test failed with status ${TEST_STATUS}."
            echo "---- Playwright/CI log (last 200 lines) ----"
            tail -n 200 "${DEV_SERVER_LOG_FILE}" || true
            exit "${TEST_STATUS}"
          fi

      - name: Build Desktop App (Linux CPU smoke)
        # Linux 기본 빌드 경로에서 임베디드 AI 비활성 기준으로 번들링이 깨지지 않는지 점검
        run: npm run tauri build

      - name: Verify Linux CPU artifacts (deb/appimage)
        run: npm run verify:linux-bundles
