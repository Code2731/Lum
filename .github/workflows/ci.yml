name: LUM CI (Continuous Integration)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 1. Setup Node.js & Test Frontend
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Frontend Dependencies
        run: npm install

      - name: Run Frontend Tests (Vitest)
        run: npm test

      - name: Build Frontend
        run: npm run build

      # 2. Setup Rust & Test Backend
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install System Dependencies (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf \
            libasound2-dev libxdo-dev libxtst-dev libx11-dev libxrandr-dev \
            libxcb1-dev libxcb-shm0-dev libxcb-randr0-dev

      - name: Rust Format Check
        run: cd src-tauri && cargo fmt -- --check

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Backend Check & Clippy
        # clippy 경고는 안내용으로만 실행. 에러만 CI 실패 유발.
        # 추후 품질 게이트 강화 시 -D warnings 복원 고려.
        run: cd src-tauri && cargo check --no-default-features && cargo clippy --no-default-features -- -A warnings

      - name: Run Backend Tests
        run: cd src-tauri && cargo test
