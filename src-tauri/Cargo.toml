[package]
name = "tauri-app"
version = "0.3.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"
# Phase 82 binary 추가 후 cargo run이 모호해짐 — Tauri 본체를 기본으로 명시.
default-run = "tauri-app"

[lib]
name = "tauri_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# Phase 82 — LUM 자체 도구를 MCP server로 노출하는 별도 binary.
# 외부 LLM agent (CrewAI / Claude Desktop 등)가 stdio MCP로 LUM 기능 호출.
[[bin]]
name = "lum-mcp-server"
path = "src/bin/mcp_server.rs"

[features]
# 기본 빌드: 로컬 AI 없이 경량 배포용
default = []
# GPU 기반 로컬 추론 인프라 (burn/wgpu/tokenizers — 개발/실험용)
local-ai = ["dep:burn", "dep:burn-wgpu", "dep:wgpu", "dep:tokenizers", "dep:hf-hub", "dep:safetensors", "dep:half", "dep:bytemuck"]
# Phase 85b — mistralrs(high-level wrapper)를 LUM 프로세스 안에 직접 임베딩.
# Phase 102 — Windows/Linux는 CUDA, macOS는 Metal 백엔드 자동 선택 (target_os 분기).
# 첫 빌드 5~15분. Windows: CUDA toolchain 12.x + MSVC. macOS: Xcode (Metal SDK 포함).
# 활성화: scripts\cargo-check-cuda.bat 또는 npm run tauri:dev:cuda (Windows) / npm run tauri:dev:metal (macOS)
embedded-ai = ["dep:mistralrs", "dep:mistralrs-core"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
# Phase 115 — Quake Mode 전역 단축키 (앱 비활성 상태에서도 윈도우 토글)
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1.3"
reqwest = { version = "0.12", features = ["json", "stream"] }
portable-pty = "0.9"
tokio = { version = "1", features = ["full"] }
futures-util = "0.3"
ignore = "0.4.25"
libp2p = { version = "0.53", features = ["tcp", "dns", "websocket", "noise", "yamux", "mdns", "gossipsub", "request-response", "tokio"] }
libp2p-request-response = { version = "0.26", features = ["json"] }
enigo = "0.2"
screenshots = "0.8"
base64 = "0.22"
futures = "0.3"
thiserror = "2.0.18"
sysinfo = "0.32"
dirs = "5"
# Phase 135 — 기본 마이크 캡처(CPAL) + WAV 기록. 전사는 로컬 whisper.cpp에 위임한다.
cpal = "0.15.3"
hound = "3.5.1"
sha1 = "0.10"

# Phase 70 — Repo Map (tree-sitter AST + PageRank)
tree-sitter = "0.23"
tree-sitter-rust = "0.23"
tree-sitter-typescript = "0.23"
tree-sitter-javascript = "0.23"
tree-sitter-python = "0.23"
petgraph = "0.6"

# local-ai 피처일 때만 컴파일 (기본 배포에서 제외 → 바이너리 ~150MB 절감)
burn     = { version = "0.16.0", features = ["wgpu"], optional = true }
burn-wgpu = { version = "0.16.0", optional = true }
wgpu     = { version = "22.1", optional = true }
tokenizers = { version = "0.19", optional = true }
hf-hub   = { version = "0.3", optional = true }
safetensors = { version = "0.7.0", optional = true }
half = { version = "2.7.1", optional = true }
bytemuck = { version = "1.25.0", features = ["derive"], optional = true }
tauri-plugin-dialog = "2.7.0"

# Phase 71/85b/102 — Windows/Linux: NVIDIA NVML 정확 VRAM + mistralrs CUDA 백엔드.
[target.'cfg(not(target_os = "macos"))'.dependencies]
nvml-wrapper = "0.10"
mistralrs = { git = "https://github.com/EricLBuehler/mistral.rs", branch = "master", features = ["cuda"], optional = true }
mistralrs-core = { git = "https://github.com/EricLBuehler/mistral.rs", branch = "master", optional = true }

# Phase 102 — macOS Apple Silicon: mistralrs Metal 백엔드 (M1/M2/M3 GPU + 통합 메모리).
# Intel Mac은 Metal 미지원이라 사실상 Apple Silicon 전용 — Intel Mac은 Gemini 클라우드 폴백.
[target.'cfg(target_os = "macos")'.dependencies]
mistralrs = { git = "https://github.com/EricLBuehler/mistral.rs", branch = "master", features = ["metal"], optional = true }
mistralrs-core = { git = "https://github.com/EricLBuehler/mistral.rs", branch = "master", optional = true }
