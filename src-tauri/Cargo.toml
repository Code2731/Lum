[package]
name = "tauri-app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

[lib]
name = "tauri_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1.3"
reqwest = { version = "0.12", features = ["json", "stream"] }
portable-pty = "0.9"
tokio = { version = "1", features = ["full"] }
futures-util = "0.3"
ignore = "0.4.25"
libp2p = { version = "0.53", features = ["tcp", "dns", "websocket", "noise", "yamux", "mdns", "gossipsub", "request-response", "tokio"] }
libp2p-request-response = { version = "0.26", features = ["json"] }
enigo = "0.2"
screenshots = "0.8"
base64 = "0.22"
futures = "0.3"
burn = { version = "0.16.0", features = ["wgpu"] }
burn-wgpu = "0.16.0"
wgpu = "22.1"
tokenizers = "0.19"
hf-hub = "0.3"
thiserror = "2.0.18"
sysinfo = "0.32"
dirs = "5"
